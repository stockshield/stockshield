# 정기 대사 결과 확인 (ADM_REC_001 #4, 기획서 11장)
#
# - 메인 서버의 정기 대사는 평일 16:00(KST)에 시작하고, 실패하면 1분 간격으로 최대 10번 다시 시도한다.
#   그래서 16:20(KST)에 결과를 확인한다. GitHub 예약 시각은 UTC라 "20 7 * * 1-5"다.
#   GitHub 예약 실행은 몇 분 늦게 시작될 수 있다.
# - 실패(불일치 계좌, 대사 실패, 기록 없음, 서버 오류)면 이 워크플로가 실패해 저장소 관리자에게 알림 메일이 간다.
# - 필요한 설정 (Settings → Secrets and variables → Actions)
#   · Secrets  INTERNAL_TOKEN: 배포 서버 .env의 INTERNAL_TOKEN과 같은 값
#   · Variables DEPLOY_BASE_URL: 배포 주소 (없으면 http://13.55.65.203)
#   INTERNAL_TOKEN이 아직 없으면(배포 전) 확인을 건너뛰고 성공으로 끝난다.
# - 수동 실행(workflow_dispatch)에서는 날짜(YYYYMMDD)를 골라 다시 확인할 수 있다.
name: reconcile

on:
  schedule:
    - cron: "20 7 * * 1-5"
  workflow_dispatch:
    inputs:
      rcclDt:
        description: "확인할 대사일 (YYYYMMDD, 비우면 오늘)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: 설정 확인
        id: cfg
        env:
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          if [ -z "$INTERNAL_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### 정기 대사 확인" >> "$GITHUB_STEP_SUMMARY"
            echo "INTERNAL_TOKEN이 아직 등록되지 않아(배포 전) 확인을 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 대사 결과 확인
        if: steps.cfg.outputs.skip == 'false'
        env:
          BASE_URL: ${{ vars.DEPLOY_BASE_URL || 'http://13.55.65.203' }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          RCCL_DT: ${{ github.event.inputs.rcclDt }}
        run: python3 .github/scripts/reconcile_check.py
