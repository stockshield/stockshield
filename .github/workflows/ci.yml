# CI: PR마다 백엔드 테스트, AI 서버 테스트, 프론트 빌드 (SYS_DEV_001 #1, 연결 합의서 v0.0.8 12절 합의 23-1)
#
# - develop 브랜치 보호의 필수 상태 체크로 등록한다. 등록은 워크플로 파일 이름이 아니라 아래 job 이름
#   (backend, ai-server, frontend)으로 한다. 필수 체크가 항상 보고되도록 paths 필터는 두지 않는다.
# - DB·Redis는 Testcontainers가 직접 띄우므로 서비스 컨테이너를 두지 않는다(로컬과 같은 테스트 코드·같은 이미지 태그).
# - CI에는 infra/.env가 없다. 설정 키는 기본값만으로 기동해야 한다(합의서 3절 설정 키).
# - 아직 코드가 없는 단계(AI 서버)는 폴더가 생길 때까지 건너뛴다. job은 항상 돌고 성공으로 끝나 필수 체크가 막히지 않는다.
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # SYS_ENV_001 #1: Java 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Windows에서 커밋해 실행 권한이 빠진 경우를 대비한다
      - run: chmod +x gradlew

      # @Tag("fds-scenario")는 build.gradle의 test 작업이 이미 뺀다(fds-scenario.yml에서 따로 실행)
      - name: 백엔드 테스트 (Testcontainers PostgreSQL 15.19)
        run: ./gradlew test --no-daemon

      - name: 테스트 보고서 올리기 (실패했을 때)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          retention-days: 7

  ai-server:
    name: ai-server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: AI 서버 폴더 확인
        id: detect
        run: |
          if [ -f ai-server/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ai-server/requirements.txt가 아직 없어 AI 서버 테스트를 건너뜁니다."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-server/requirements*.txt

      - name: 의존성 설치
        if: steps.detect.outputs.present == 'true'
        working-directory: ai-server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest; fi

      # 모은 테스트가 없으면 pytest는 종료 코드 5로 끝난다. 테스트를 아직 쓰지 않은 단계에서 필수 체크가 막히지 않게 5는 통과로 본다
      - name: pytest
        if: steps.detect.outputs.present == 'true'
        working-directory: ai-server
        env:
          GEMINI_API_KEY: ''
        run: |
          set +e
          python -m pytest -q
          code=$?
          if [ "$code" -eq 5 ]; then echo "모은 테스트가 없습니다(통과로 처리)"; exit 0; fi
          exit $code

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: 프론트 빌드
        run: npm run build
