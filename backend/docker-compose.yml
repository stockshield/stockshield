version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: stockshield-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: stockshield_db
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    container_name: stockshield-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data:
