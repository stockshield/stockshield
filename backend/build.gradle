plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.stockshield'
version = '0.0.1-SNAPSHOT'

// SYS_ENV_001: Java 17 고정 (Gradle Toolchain)
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// Spring Boot 3.3.5가 관리하는 Testcontainers(1.19.x)는 Docker API 1.32로 접속하는데,
// 최신 Docker Desktop(엔진 29 이상)은 1.40 미만 요청을 거절한다. 1.21.4부터 API 1.44로 접속한다.
ext['testcontainers.version'] = '1.21.4'

dependencies {
    // 웹 · 입력 검증
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // DB: JPA + PostgreSQL, 스키마는 Flyway SQL로 관리 (SYS_ENV_001 #10)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // 시세 캐시 · 인증 코드 (Redis)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 인증·권한 (USR_AUTH_002·003, SYS_SEC_001). SecurityConfig와 함께 넣는다. BCrypt 인코더(spring-security-crypto)도 여기에 들어 있다
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JWT 발급·검증 (USR_AUTH_002 #1). Spring Boot가 버전을 관리하지 않는 라이브러리라 버전을 적는다(연결 합의서 3절 build.gradle).
    // 0.12.x는 Java 17과 Boot 3.3의 Jackson으로 돌고, HMAC 키가 256비트 미만이면 서명을 거부한다
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // FDS·시세 파트가 쓰는 의존성 (Kafka 시세 컨슈머, 인증 메일, WebSocket 관제)
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 테스트: 실제 PostgreSQL 15.19 컨테이너에서 검증 (TRD_LED_001 테스트)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    // 커밋 뒤 비동기로 쓰이는 탐지 기록을 기다릴 때 쓴다 (연결 합의서 12절). 버전은 Spring Boot가 관리한다
    testImplementation 'org.awaitility:awaitility'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 모든 테스트 작업의 공통 설정
tasks.withType(Test).configureEach {
    // SYS_ENV_001 #9: 시간대 Asia/Seoul 고정
    jvmArgs '-Duser.timezone=Asia/Seoul'
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// PR마다 도는 전체 테스트(ci.yml). 공격 시나리오는 fdsScenarioTest로 따로 돈다
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'fds-scenario'
    }
}

// SYS_DEV_001 #2: FDS 공격 시나리오(@Tag("fds-scenario"))만 실행한다(fds-scenario.yml)
tasks.register('fdsScenarioTest', Test) {
    description = 'FDS 공격 시나리오(@Tag("fds-scenario"))만 실행한다'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'fds-scenario'
    }
    shouldRunAfter tasks.named('test')
}

// 최초 관리자 계정 비밀번호의 BCrypt 해시($2a$10$…, infra/.env의 ADMIN_PWD_HASH)를 만든다 (USR_AUTH_003 #3, backend/README.md).
// 비밀번호는 명령 인자로 받지 않고 실행 중에 입력받아 PowerShell 명령 기록에 남지 않게 한다.
// 앱과 같은 BCryptPasswordEncoder를 써서 형식이 어긋나지 않는다. 테스트 코드 쪽에 두어 배포 jar에는 들어가지 않는다.
tasks.register('adminPasswordHash', JavaExec) {
    description = '관리자 비밀번호의 BCrypt 해시를 만든다 (ADMIN_PWD_HASH)'
    group = 'help'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.stockshield.support.AdminPasswordHash'
    standardInput = System.in
}
