# 테스트 전용 설정. Spring Boot가 classpath:/config/application.properties를 application.yml 위에 덮어 읽는다.
# 테스트 중에는 AI 서버를 부르지 않는다 (연결 합의서 12절, 회신 6번). AI 호출 테스트는 켠 인스턴스를 직접 만든다.
stockshield.ai.enabled=false
# PC의 infra/.env에 실전 KIS 키가 있어도 테스트가 실제 KIS(호가·일봉)를 부르지 않게 비운다. KIS 테스트는 가짜 서버로 직접 만든다
stockshield.kis.app-key=
stockshield.kis.app-secret=
