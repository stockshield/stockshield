# StockShield nginx: 화면 파일을 내보내고 /api·/ws를 메인 서버(backend:8080)로 넘긴다.
# 외부에 열린 포트는 이 nginx의 80번 하나다. DB·Redis·Kafka·AI 서버는 docker 네트워크 안에서만 보인다.
#
# X-Forwarded-For: 사용자 주소를 메인 서버에 넘긴다. 화면이 보낸 X-Forwarded-For는 버리고
# nginx가 직접 본 주소($remote_addr) 하나만 넣는다. 메인 서버는 nginx(172.28.0.10)가 보낸 값만 믿는다(P11, SYS_SEC_001 #4).

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 1m;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 메인 서버 REST API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # STOMP over WebSocket (시세·관제 알림). 연결이 오래 유지되므로 읽기 제한 시간을 길게 둔다
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 화면(SPA): 없는 경로는 index.html로 돌려 화면 라우터가 처리한다
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
